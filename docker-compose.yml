services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=4000
      - WORKER_QUEUES=default,critical,email,reports
    depends_on:
      redis:
        condition: service_healthy
    command: ["npm", "run", "api"]

  worker-1:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_QUEUES=default,critical,email,reports
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["npm", "run", "worker", "--", "--id=1"]

  worker-2:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_QUEUES=default,critical,email,reports
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["npm", "run", "worker", "--", "--id=2"]

  worker-3:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379
      - WORKER_QUEUES=default,critical,email,reports
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["npm", "run", "worker", "--", "--id=3"]
